{% extends "admin/index.html" %}

{% block content %}
<div class="mb-8 grid grid-cols-2 gap-4 lg:grid-cols-4">
    <div class="rounded-default border border-base-200 bg-white p-6 shadow-xs dark:border-base-800 dark:bg-base-900">
        <div class="text-sm font-medium text-base-500 dark:text-base-400">Messages Sent</div>
        <div class="mt-2 text-3xl font-semibold text-base-900 dark:text-base-100">{{ messages_sent }}</div>
    </div>
    <div class="rounded-default border border-base-200 bg-white p-6 shadow-xs dark:border-base-800 dark:bg-base-900">
        <div class="text-sm font-medium text-base-500 dark:text-base-400">Replies Received</div>
        <div class="mt-2 text-3xl font-semibold text-base-900 dark:text-base-100">{{ replies_received }}</div>
    </div>
    <div class="rounded-default border border-base-200 bg-white p-6 shadow-xs dark:border-base-800 dark:bg-base-900">
        <div class="text-sm font-medium text-base-500 dark:text-base-400">Connection Requests Sent</div>
        <div class="mt-2 text-3xl font-semibold text-base-900 dark:text-base-100">{{ connect_requests_sent }}</div>
    </div>
    <div class="rounded-default border border-base-200 bg-white p-6 shadow-xs dark:border-base-800 dark:bg-base-900">
        <div class="text-sm font-medium text-base-500 dark:text-base-400">Connection Requests Accepted</div>
        <div class="mt-2 text-3xl font-semibold text-base-900 dark:text-base-100">{{ connect_requests_accepted }}</div>
    </div>
</div>

{{ block.super }}
{% endblock %}
