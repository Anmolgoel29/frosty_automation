# local.yml
#
# One container runs the admin panel (always up), the automation daemon, and a
# VNC server so you can watch the Playwright browser.
#
#   Admin panel : http://localhost:8000/admin/   (login: admin / admin)
#   Browser (web VNC) : http://localhost:6080/vnc.html
#     One port, one account at a time — switch via Admin → LinkedIn Profile
#     → "Watch this account's browser (VNC)".
#   Browser (native VNC client) : localhost:5900  (no password)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-openoutreach}
      - POSTGRES_USER=${POSTGRES_USER:-openoutreach}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-openoutreach}
    volumes:
      - openoutreach_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openoutreach} -d ${POSTGRES_DB:-openoutreach}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: ./compose/linkedin/Dockerfile
      args:
        - BUILD_ENV=local
    restart: unless-stopped
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENABLE_VNC=true
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      # Auto-created on first boot so you can log into the admin panel.
      # Change these (especially the password) before exposing the panel.
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-admin}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      # The one knob for the database. Defaults to the bundled `db` service;
      # point it at a hosted Postgres (Supabase/Neon/RDS) to use that instead.
      - DATABASE_URL=${DATABASE_URL:-postgresql://openoutreach:openoutreach@db:5432/openoutreach}
    volumes:
      - .:/app
    ports:
      - "8000:8000"   # Django admin panel
      - "6080:6080"   # noVNC (browser-based browser viewer)
      - "5900:5900"   # native VNC client

volumes:
  openoutreach_pgdata:
