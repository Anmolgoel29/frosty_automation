# docker-compose.yml
#
# Deployment compose file. One container runs everything:
#   Admin panel (always up)     : http://localhost:8000/admin/   (login: admin / admin)
#   Browser view — noVNC (web)  : http://localhost:6080/vnc.html
#     Each LinkedIn account renders on its own X display behind this one port.
#     Switch which one you're watching: Admin → LinkedIn Profile → tick one
#     → "Watch this account's browser (VNC)", then reload the noVNC tab.
#   Browser view — native VNC   : vnc://localhost:5900           (no password)
#
# Structured data (leads, deals, campaigns, model blobs) lives in Postgres, in the
# named `openoutreach_pgdata` volume. Cookies, config.json, and the fastembed cache
# persist in the named `openoutreach_data` volume mounted at /app/data.
#
# For live-code development instead, use local.yml (bind-mounts the repo).
#
#   docker compose up -d --build
#   docker compose logs -f

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Load a .env sitting next to this compose file (optional — falls back to
    # the defaults below when absent). Its vars populate the container env and
    # are also available for the ${VAR} interpolation in `environment:`.
    env_file:
      - path: .env
        required: false
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-openoutreach}
      - POSTGRES_USER=${POSTGRES_USER:-openoutreach}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-openoutreach}
    volumes:
      - openoutreach_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openoutreach} -d ${POSTGRES_DB:-openoutreach}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: ./compose/linkedin/Dockerfile
      args:
        - BUILD_ENV=production
    image: openoutreach:latest
    restart: unless-stopped
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy
    # Load a .env sitting next to this compose file (optional — falls back to
    # the defaults below when absent). Put DATABASE_URL, DJANGO_SUPERUSER_*, etc.
    # here to point the app at your own Postgres/PgBouncer without editing compose.
    env_file:
      - path: .env
    environment:
      - ENABLE_VNC=true
      # Auto-created on first boot so you can log into the admin panel.
      # CHANGE THE PASSWORD before exposing port 8000 to any network.
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-admin}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      # Reaching the admin panel from a remote host/IP? List its origin(s) here,
      # e.g. CSRF_TRUSTED_ORIGINS=http://1.2.3.4:8000,https://crm.example.com
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-*}
      # The one knob for the database. Defaults to the bundled `db` service;
      # point it at a hosted Postgres (Supabase/Neon/RDS) to use that instead —
      # e.g. DATABASE_URL=postgresql://postgres:pw@db.xxx.supabase.co:5432/postgres?sslmode=require
      - DATABASE_URL=${DATABASE_URL:-postgresql://openoutreach:openoutreach@db:5432/openoutreach}
    volumes:
      - openoutreach_data:/app/data
    ports:
      - "8000:8000"   # Django admin panel
      - "6080:6080"   # noVNC (browser-based browser viewer)
      - "5900:5900"   # native VNC client

volumes:
  openoutreach_data:
  openoutreach_pgdata:
