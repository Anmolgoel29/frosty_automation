{% extends "base.html" %}
{% block title %}Delete {{ admin.label }} — OpenOutreach Admin{% endblock %}
{% block content %}
<h1>Delete {{ admin.label }}?</h1>
<p>Are you sure you want to delete <strong>{{ obj }}</strong>? This cannot be undone.</p>
<form method="post" action="/admin/{{ admin.slug }}/{{ obj_id }}/delete">
    <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
    <button type="submit" class="danger-button">Delete</button>
    <a href="/admin/{{ admin.slug }}" class="secondary-button">Cancel</a>
</form>
{% endblock %}
